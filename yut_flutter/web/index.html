<!DOCTYPE html>
<html>
<head>
  <script>
    if (window.opener && (window.location.hash.includes("id_token=") || window.location.search.includes("id_token="))) {
      try {
        window.opener.postMessage({ type: "GOOGLE_ID_TOKEN", hash: window.location.hash || window.location.search }, window.location.origin);
      } catch (_) {}
      window.close();
    }
  </script>

  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Yut Board Game">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Yut Game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Yut Game</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Full screen HTML5 CSS Loader -->
  <div id="loading-indicator" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #1E262C; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; font-family: sans-serif; transition: opacity 0.3s ease-in-out; opacity: 1;">
    <img src="favicon.png" style="width: 80px; height: 80px; margin-bottom: 24px; animation: pulse 1.8s infinite ease-in-out;">
    <div style="color: #ffffff; font-size: 22px; font-weight: bold; margin-bottom: 8px; letter-spacing: 0.5px;">Yut Game</div>
    <div style="color: #7F8C8D; font-size: 14px;">Loading game assets...</div>
    <style>
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }
    </style>
  </div>

  <script>
    window.flutterWebRenderer = "html";

    var bgMusic = null;
    function playBackgroundMusic() {
      if (!bgMusic) {
        bgMusic = new Audio('assets/assets/audio/song.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.3;
      }
      bgMusic.play().catch(function(error) {
        console.log("Audio autoplay blocked by browser policy. Will retry on next interaction.");
      });
    }
    function pauseBackgroundMusic() {
      if (bgMusic) {
        bgMusic.pause();
      }
    }
    function removeLoader() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 300);
      }
    }

    let _googleAuthPendingCallback = null;
    let _googleAuthErrorCallback = null;

    window.addEventListener("message", function(event) {
      if (event.origin === window.location.origin && event.data && event.data.type === "GOOGLE_ID_TOKEN") {
        const hashStr = event.data.hash || "";
        const params = new URLSearchParams(hashStr.split("#")[1] || hashStr.split("?")[1]);
        const jwt = params.get("id_token");
        if (jwt && _googleAuthPendingCallback) {
          try {
            const payload = JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            _googleAuthPendingCallback(JSON.stringify({
              googleId: payload.sub,
              email: payload.email,
              name: payload.given_name || (payload.name ? payload.name.split(" ")[0] : "Player"),
              token: jwt
            }));
            _googleAuthPendingCallback = null;
            _googleAuthErrorCallback = null;
          } catch (_) {}
        }
      }
    });

    function triggerGoogleAuth(clientIdArg, onSuccess, onError) {
      _googleAuthPendingCallback = onSuccess;
      _googleAuthErrorCallback = onError;

      const validClientId = (typeof clientIdArg === 'string' && clientIdArg.includes('.apps.googleusercontent.com'))
        ? clientIdArg
        : '223698446706-nf21ero1897j813o81db0nsmsrhavojs.apps.googleusercontent.com';

      if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: validClientId,
          callback: (response) => {
            if (response && response.credential) {
              const jwt = response.credential;
              try {
                const payload = JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                if (onSuccess) {
                  onSuccess(JSON.stringify({
                    googleId: payload.sub,
                    email: payload.email,
                    name: payload.given_name || (payload.name ? payload.name.split(" ")[0] : "Player"),
                    token: jwt
                  }));
                }
              } catch (e) {
                if (onError) onError("Failed to parse token payload");
              }
            } else {
              if (onError) onError("Sign in failed");
            }
          }
        });
        google.accounts.id.prompt((notification) => {
          if (notification.isNotDisplayed() || notification.isSkippedMoment() || notification.isDismissedMoment()) {
            openOAuthPopup(validClientId, onSuccess, onError);
          }
        });
        return;
      }

      openOAuthPopup(validClientId, onSuccess, onError);
    }

    function openOAuthPopup(validClientId, onSuccess, onError) {
      const redirectUri = window.location.origin + window.location.pathname;
      const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(validClientId)}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=id_token&scope=email%20profile&nonce=yutgame`;
      
      const popup = window.open(url, "Google Sign In", "width=500,height=600");
      if (!popup) {
        if (onError) onError("Popup blocked by browser. Please allow popups for this site.");
        return;
      }

      const timer = setInterval(() => {
        try {
          if (!popup || popup.closed) {
            clearInterval(timer);
            return;
          }
          
          let href = "";
          try { href = popup.location.href; } catch (_) {}
          if (href && href.includes("id_token=")) {
            clearInterval(timer);
            const params = new URLSearchParams(href.split("#")[1] || href.split("?")[1]);
            const jwt = params.get("id_token");
            popup.close();
            if (jwt && onSuccess) {
              const payload = JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
              onSuccess(JSON.stringify({
                googleId: payload.sub,
                email: payload.email,
                name: payload.given_name || (payload.name ? payload.name.split(" ")[0] : "Player"),
                token: jwt
              }));
            }
          }
        } catch (_) {}
      }, 300);
    }
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
